<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="signup">
  <div class="shell">
    <aside class="brand-panel">
      <a class="wordmark" href="login.html">ZeelTech</a>
      <div>
        <p class="brand-headline">Make an account.</p>
        <p class="brand-sub">It takes under a minute.</p>
      </div>
    </aside>

    <main class="form-panel">
      <div class="form-wrap">
        <h1>Create your account</h1>
        <p class="lede">Fill in your details to get started.</p>

        <form id="signup-form" data-form="signup">
          <p class="form-error" id="form-error" role="alert" hidden></p>

          <div class="field">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
            <p class="field-error" id="name-error"></p>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <p class="field-error" id="email-error"></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-row">
              <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
              <button type="button" class="toggle" data-toggle-password="password" aria-controls="password">Show</button>
            </div>
            <p class="hint">At least 8 characters.</p>
            <p class="field-error" id="password-error"></p>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
            <p class="field-error" id="confirmPassword-error"></p>
          </div>

          <button type="submit" class="btn">Create account</button>
        </form>

        <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </main>
  </div>
  <script src="auth.js" defer></script>
  <script src="ui.js"></script>
</body>
</html>
