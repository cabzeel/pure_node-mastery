<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
  <!-- Absolute paths so this page still styles correctly when served for nested URLs like /a/b/c -->
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="not-found">
  <div class="shell">
    <aside class="brand-panel">
      <a class="wordmark" href="/login.html">ZeelTech</a>
      <div>
        <p class="brand-headline">404</p>
        <p class="brand-sub">We could not find that page.</p>
      </div>
    </aside>

    <main class="form-panel">
      <div class="form-wrap stack">
        <h1>Page not found</h1>
        <p class="status-line">The link may be broken, or the page may have moved. Check the address, or go back to a page below.</p>
        <a class="btn" href="/dashboard.html">Go to dashboard</a>
        <a class="btn btn-outline" href="/login.html">Log in</a>
      </div>
    </main>
  </div>
</body>
</html>
