<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Dashboard · ZeelTech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
  <!-- no query strings on assets: your static server matches the raw url to a file name -->
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <a class="wordmark" href="#/overview">ZeelTech</a>
      <nav>
        <a href="#/overview" data-route="overview">Overview</a>
        <a href="#/feed" data-route="feed">Feed</a>
        <a href="#/workouts" data-route="workouts">Workouts</a>
        <a href="#/profile" data-route="profile">Profile</a>
      </nav>
      <div class="me">
        <span class="avatar" id="avatar">?</span>
        <div><strong id="me-name">…</strong><small id="me-email"></small></div>
      </div>
      <button class="btn ghost light" id="logout">Log out</button>
    </aside>

    <main id="view" class="main" aria-live="polite"></main>
  </div>

  <dialog id="modal"></dialog>
  <div id="toasts"></div>

  <button id="log-toggle" class="log-toggle">API log</button>
  <aside id="log" hidden>
    <h4>Requests <small>(tokens hidden)</small></h4>
    <ul id="log-list"></ul>
  </aside>

  <script src="dashboard.js" defer></script>
</body>
</html>
